<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
</head>
<body>

<div class="corpo" layout:fragment="corpo">

    <div class="wrapper">
        <section class="section section-shaped section-lg">
            <div class="shape shape-style-1 bg-gradient-darker">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="container pt-lg-4">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card bg-secondary shadow border-0">
                            <div class="card-header">
                                <div class="text-center">
                                    <h4 class="card-title mt-3 text-center">TERMINAR TORNEIO</h4>
                                </div>
                            </div>
                            <div class="card-body px-lg-5 py-lg-5">

                            <div class="form-group">
                                <label for="torneio">Torneio</label>
                                <select class="form-control" id="torneio" name="instrutor" required>
                                    <option disabled selected value="">Selecione</option>
                                    <option th:each="t : ${torneiosNTerIni}"
                                            th:text="${'Data inicio: ' + t.dataInicio + ' -/- Categoria: ' +t.categoriaTorneio.nome}"
                                            th:value="${t.id}">...
                                    </option>
                                </select>
                            </div>
                                <div class="text-center">
                                     <button id="submit" class="btn btn-lg btn-github btn-icon my-4" type="submit">Terminar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/termina_torneio.js}"></script>
</th:block>

</body>
</html>
