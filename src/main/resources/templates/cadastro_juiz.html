<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="usuario" type="com.control.ata.security.entity.Usuario"*/-->
<head>
</head>

<body>

<div class="corpo" layout:fragment="corpo">

    <div class="wrapper">
        <section class="section section-shaped section-lg">
            <div class="shape shape-style-1 bg-gradient-darker">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="container pt-lg-4">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card bg-secondary shadow border-0">
                            <div class="card-header">
                                <div class="text-center">
                                    <h2 class="h3 text-dark font-weight-bold mb-4">COMPETIDOR</h2>
                                    <div class="text-center text-muted mb-4">
                                        <small>Insira as seguintes informações sobre sua Academia.</small>
                                    </div>
                                </div>
                            </div>
                            <div class="card-body px-lg-5 py-lg-5">

                                <form action="#" class="text-left" id="form-register-juiz">

                                    <input hidden id="pessoa_id" th:value="${usuario.pessoa.id}">

                                    <div class="form-group">
                                        <label for="torneio">Torneio</label>
                                        <select class="form-control" id="torneio" name="instrutor" required>
                                            <option disabled selected value="">Selecione</option>
                                            <option th:each="t : ${torneiosNIni}"
                                                    th:text="${'Data inicio: ' + t.dataInicio + ' -/- Categoria: ' +t.categoriaTorneio.nome}"
                                                    th:value="${t.id}">...
                                            </option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label>Quantidade de rodadas</label>
                                        <input class="form-control" id="quant_rodada" name="quant_rodada"
                                               placeholder="0"
                                               required type="number">
                                    </div>

                                    <div class="form-group" id="rodadas_div"></div>

                                    <div class="text-center">
                                        <button class="btn btn-lg btn-github btn-icon my-4" type="submit">Criar Conta
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="row row-grid align-items-center mb-5">
                <div class="col-lg-6">
                    <h3 class="text-primary font-weight-light mb-2">Thank you for supporting us!</h3>
                    <h4 class="mb-0 font-weight-light">Let's get in touch on any of these platforms.</h4>
                </div>
                <div class="col-lg-6 text-lg-center btn-wrapper">
                    <button class="btn btn-icon-only btn-twitter rounded-circle" data-original-title="Follow us" data-toggle="tooltip"
                            href="https://twitter.com/creativetim" rel="nofollow"
                            target="_blank">
                        <span class="btn-inner--icon"><i class="fa fa-twitter"></i></span>
                    </button>
                    <button class="btn-icon-only rounded-circle btn btn-facebook" data-original-title="Like us" data-toggle="tooltip"
                            href="https://www.facebook.com/CreativeTim/" rel="nofollow"
                            target="_blank">
                        <span class="btn-inner--icon"><i class="fab fa-facebook"></i></span>
                    </button>
                    <button class="btn btn-icon-only btn-dribbble rounded-circle" data-original-title="Follow us" data-toggle="tooltip"
                            href="https://dribbble.com/creativetim" rel="nofollow"
                            target="_blank">
                        <span class="btn-inner--icon"><i class="fa fa-dribbble"></i></span>
                    </button>
                    <button class="btn btn-icon-only btn-github rounded-circle" data-original-title="Star on Github" data-toggle="tooltip"
                            href="https://github.com/creativetimofficial" rel="nofollow"
                            target="_blank">
                        <span class="btn-inner--icon"><i class="fa fa-github"></i></span>
                    </button>
                </div>
            </div>
            <hr>
            <div class="row align-items-center justify-content-md-between">
                <div class="col-md-6">
                    <div class="copyright">
                        &copy; 2020 <a href="" target="_blank">Creative Tim</a>.
                    </div>
                </div>
                <div class="col-md-6">
                    <ul class="nav nav-footer justify-content-end">
                        <li class="nav-item">
                            <a class="nav-link" href="" target="_blank">Creative Tim</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="" target="_blank">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="" target="_blank">Blog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="" target="_blank">License</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/cadastro_juiz.js}"></script>
</th:block>

</body>

</html>
