<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

</head>

<body>

<div class="corpo" layout:fragment="corpo">

    <div class="py-5" style="
    background-image: url(../assets/img/img-fundo-home.jpg); background-size: 100%;
    background-position: top left;	background-repeat: no-repeat;">
        <div class="container">
            <div class="row">
                <div class="col-md-4 offset-md-4 bg-translucent-secondary">
                    <h1>Entre em sua conta</h1>
                    <p class="mb-3" contenteditable="true"></p>
                    <form role="form" th:action="@{/login}" th:method="post">
                        <p class="error" th:if="${param.error}">Wrong user or password</p>
                        <div class="form-group">
                            <input class="form-control" id="username" name="username" placeholder="Enter email"
                                   type="text">
                        </div>
                        <div class="form-group">
                            <input class="form-control" id="password" name="password" placeholder="Password"
                                   type="password">
                            <small class="form-text text-muted text-right">
                                <a href="#"> Forgot your password?</a>
                            </small>
                        </div>
                        <button class="btn btn-primary" type="submit">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
