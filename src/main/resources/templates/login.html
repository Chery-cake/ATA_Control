<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">

    <meta content="width=device-width, initial-scale=1" name="viewport">
    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        /*html,*/
        /*body {*/
        /*    height: 100%;*/
        /*}*/

        body {

            align-items: center;

        }

        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;
        }

        .form-signin .checkbox {
            font-weight: 400;
        }

        .form-signin .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }

        .form-signin .form-control:focus {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

    </style>


</head>

<body class="text-center">

<div class="corpo" layout:fragment="corpo">

    <div class="wrapper">
        <section class="section section-shaped section-lg">
            <div class="shape shape-style-1 bg-gradient-darker">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="container pt-lg-4">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card bg-secondary shadow border-0">
                            <div class="card-body px-lg-5 py-lg-5">
                            <main class="form-signin">

                                <form role="form" th:action="@{/login}" th:method="post">
                                    <img
                                            alt="Ata-Control"
                                            class="mb-4"
                                             width="100" height="50" th:src="@{../assets/img/logo-ata.png}"
                                            >
                                    <p class="error" th:if="${param.error}">Email ou senha incorreto(a)</p>
                                    <br>
                                    <label class="visually-hidden" for="username">Email address</label>
                                    <input autofocus class="form-control" id="username"
                                           name="username" placeholder="Email">

                                    <label class="visually-hidden" for="password">Password</label>
                                    <input class="form-control" id="password" name="password"
                                           placeholder="Password"
                                           type="password">


                                   <!-- <div class="checkbox mb-3">

                                        <label>
                                            <input type="checkbox" value="remember-me"> Remember me
                                        </label>
                                    </div>-->
                                    <button class="btn btn-lg btn-github btn-icon my-4" type="submit">INICIAR SESSÃO</button>
                                </form>
                            </main>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>


</div>
</body>
</html>
