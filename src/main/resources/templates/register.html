<!DOCTYPE html>
<html layout:decorate="~{styleguide}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"
          type="text/css">
    <link href="https://static.pingendo.com/bootstrap/bootstrap-4.3.1.css" rel="stylesheet">
</head>

<body>

<div class="corpo" layout:fragment="corpo">

    <div class="py-5 text-center">
        <div class="container">
            <div class="row">
                <div class="mx-auto col-lg-6 col-10">
                    <h1>Crie sua conta</h1>
                    <p class="mb-3" style=""></p>

                    <form action="#" class="text-left" id="form-register-pessoa">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input class="form-control" id="nome" placeholder="Stephen" required="required"
                                   type="text">
                        </div>

                        <div class="form-group">
                            <label for="sobrenome">Sobrenome</label>
                            <input class="form-control" id="sobrenome" placeholder="Edwin King"
                                   required="required"
                                   type="text">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input class="form-control" id="email" placeholder="stephen.king@gmail.com"
                                   required="required"
                                   type="email">
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone para contato</label>
                            <input class="form-control" id="telefone" placeholder="(xxx)xxxx-xxxx"
                                   required="required"
                                   type="text">
                        </div>

                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input class="form-control" id="dataNascimento" required="required" type="date">
                        </div>

                        <div class="form-group">
                            <label>Genero: </label></br>
                            <div class="form-check form-check-inline">
                                <input checked class="form-check-input" id="inlineRadio1"
                                       name="genero" type="radio" value="true">
                                <label class="form-check-label" for="inlineRadio1" id="label-genero-M">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" id="inlineRadio2" name="genero"
                                       type="radio" value="false">
                                <label class="form-check-label" for="inlineRadio2" id="label-genero-F">Feminino</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>É Instrutor? </label></br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" id="inlineRadio1 isInstrutor_T" name="isInstrutor"
                                       onclick="hideInstrutor()" type="radio" value="true">
                                <label class="form-check-label" for="inlineRadio1 isInstrutor_T" id="label-instrutor-T">Sim</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input checked class="form-check-input" id="inlineRadio2 isInstrutor_F"
                                       name="isInstrutor" onclick="hideInstrutor()" type="radio" value="false">
                                <label class="form-check-label" for="inlineRadio2 isInstrutor_F" id="label-instrutor-F">Não</label>
                            </div>
                        </div>

                        <div class="form-group" id="instrutor_div">
                            <label for="instrutor">Instrutor</label>
                            <select class="form-control" id="instrutor" name="instrutor">
                                <option disabled selected value="">Selecione</option>
                                <option th:each="i : ${instrutores}"
                                        th:text="${i.pessoa.nome + ' ' +i.pessoa.sobrenome}" th:value="${i.id}">...
                                </option>
                            </select>
                        </div>

                        <div class="form-group" hidden id="ataNumber_div">
                            <label for="ataNumberWorld">ATA Number World</label>
                            <input class="form-control" id="ataNumberWorld" placeholder="xxxx-xxxxx" type="text">
                            <label for="ataNumberBrasil">ATA Number Brasil</label>
                            <input class="form-control" id="ataNumberBrasil" placeholder="xxxx-xxxxx" type="text">
                        </div>

                        <div class="form-group" hidden id="academia_div">
                            <label for="academia">Academias</label>
                            <select class="form-control" id="academia" name="academia">
                                <option disabled selected value="">Selecione</option>
                                <option th:each="a : ${academias}" th:text="${a.nome}" th:value="${a.id}">...
                                </option>
                            </select>
                            <a class="nav-link" th:href="@{/pessoa/academia}">Se a sua academia não aparecer na lista
                                clique aqui</a>
                        </div>


                        <div class="form-group">
                            <label for="faixa">Faixa</label>
                            <select class="form-control" id="faixa" name="faixa" required="required">
                                <option disabled selected value="">Selecione</option>
                                <option th:each="f : ${faixas}" th:text="${f.nome}" th:value="${f.id}">...</option>
                            </select>
                        </div>

                        <div class="form-group" id="endereco_div">
                            <label>Endereco</label>
                            <select class="form-control" id="pais" name="pais" required="required">
                                <option disabled selected value="">Selecione</option>
                                <option th:each="p : ${paises}" th:text="${p.nome}" th:value="${p.id}">...
                                </option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="senha">Senha</label>
                                <input class="form-control" id="senha" placeholder="••••" required="required"
                                       type="password">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="confi_senha">Confirmar senha<br></label>
                                <input class="form-control" id="confi_senha" placeholder="••••" required="required"
                                       type="password">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-check"><input class="form-check-input" id="termos" type="checkbox"
                                                           value="on">
                                <label class="form-check-label" for="termos"> I Agree with <a href="#">Term and
                                    Conditions</a> of the service </label></div>
                        </div>
                        <button class="btn btn-primary" type="submit">Register</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

</div>

<script th:fragment="js" th:src="@{/js/pessoa_register.js}"></script>
<script th:fragment="js" th:src="@{/js/endereco_form.js}"></script>

</body>

</html>
