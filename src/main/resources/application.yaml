# Server Port
server:
  port: 8090

# Postgres
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ata_control #?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  #JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: true

  # THYMELEAF
  thymeleaf:
    cache: false

  # JAVA Mail Sender
  mail:
    host: smtp.gmail.com
    port: 587
    username: <MAIL>
    password: <PASSWORD>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000