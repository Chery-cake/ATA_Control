# Server Port
server:
  port: 8090


# Postgres
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ata_control
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  #JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: true

  # THYMELEAF
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
    enabled: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html

  # JAVA Mail Sender
  mail:
    host: smtp.gmail.com
    port: 587
    username: <MAIL>
    password: <PASSWORD>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# LOG
logging:
  level:
    root: WARN
    com.memorynotfound: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO